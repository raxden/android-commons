name: Continuous Integration (Generate reports)

on:
  push:
    branches: [ master ]

  workflow_dispatch:
    inputs:

      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        default: 'Debug'

concurrency:
  # Ensure only one reports run per ref is active
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Increase Gradle heap size to prevent OOM errors in large builds
  GRADLE_OPTS: >
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.daemon.jvm.options=-Xmx2g
  # Artifact retention
  RETENTION_DAYS: 1
  # Build configuration
  BUILD_TYPE: ${{ github.event.inputs.build-type || 'Debug' }}

jobs:

  info:
    name: Workflow Information
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Print workflow information
        uses: ./.github/actions/info

  reports:
    name: Unit Tests and reports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Execute unit tests
        uses: ./.github/actions/unit_tests
        with:
          build-type: ${{ env.BUILD_TYPE }}
          retention-days: ${{ env.RETENTION_DAYS }}

      # Same job as the tests: compiled classes and test outputs are reused
      - name: Generate JaCoCo reports and upload to codecov
        uses: ./.github/actions/reports
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          build-type: ${{ env.BUILD_TYPE }}
          retention-days: ${{ env.RETENTION_DAYS }}
