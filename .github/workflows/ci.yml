name: Continuous Integration (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

run-name: "PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}"

concurrency:
  # Ensure only one run per PR is active
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Increase Gradle heap size to prevent OOM errors in large builds
  GRADLE_OPTS: >
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.daemon.jvm.options=-Xmx2g
  # Artifact retention
  RETENTION_DAYS: 1
  # Build configuration
  BUILD_TYPE: "Debug"

jobs:

  info:
    name: Workflow Information
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Print workflow information
        uses: ./.github/actions/info

  checkstyle:
    name: Check code style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Detekt
        uses: ./.github/actions/checkstyle
        with:
          retention-days: ${{ env.RETENTION_DAYS }}

  verify:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Libraries only: assemble and test in a single Gradle invocation so the
      # modules are configured and compiled once. The unit_tests action appends
      # `gradle-args` to `./gradlew test<BuildType>UnitTest`, so the extra
      # assemble task rides along there (keeps its report upload and summary).
      - name: Assemble and execute unit tests
        uses: ./.github/actions/unit_tests
        with:
          build-type: ${{ env.BUILD_TYPE }}
          gradle-args: assemble${{ env.BUILD_TYPE }} --configuration-cache
          retention-days: ${{ env.RETENTION_DAYS }}

  status:
    name: Status
    needs: [ info, checkstyle, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions: {}

    steps:
      - name: Check dependencies status
        shell: bash
        env:
          INFO_RESULT: ${{ needs.info.result }}
          CHECKSTYLE_RESULT: ${{ needs.checkstyle.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "Info: $INFO_RESULT"
          echo "Code style: $CHECKSTYLE_RESULT"
          echo "Build and unit tests: $VERIFY_RESULT"

          for result in "$INFO_RESULT" "$CHECKSTYLE_RESULT" "$VERIFY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more jobs did not succeed"
              exit 1
            fi
          done

          echo "All jobs succeeded"
